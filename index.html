<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>치지직 스트리머 리포트</title>
<link href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f4fa;--sf:#fff;--ink:#1d1a33;--mut:#6b6885;--ln:#e2e0ee;--ac:#5b3df5;--up:#0a8f5b;--dn:#d23a52;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14121f;--sf:#1d1a2e;--ink:#efedfa;--mut:#9a97b5;--ln:#2d2a45;--ac:#9b86ff;--up:#3fd49a;--dn:#ff7088}}
:root[data-theme="dark"]{--bg:#14121f;--sf:#1d1a2e;--ink:#efedfa;--mut:#9a97b5;--ln:#2d2a45;--ac:#9b86ff;--up:#3fd49a;--dn:#ff7088}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 "Gothic A1",system-ui,sans-serif}
main{max-width:980px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:24px;font-weight:800;margin:0 0 2px}
h2{font-size:16px;font-weight:800;margin:28px 0 10px}
a{color:var(--ac)}
.sub{color:var(--mut);margin:0 0 16px;font-size:13px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.seg{display:inline-flex;border:1px solid var(--ln);border-radius:8px;overflow:hidden;background:var(--sf)}
.seg button{border:0;background:none;color:var(--mut);padding:7px 14px;font:inherit;font-weight:600;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--ac);color:#fff}
select,input,textarea,button.b{font:inherit;color:var(--ink);background:var(--sf);border:1px solid var(--ln);border-radius:8px;padding:7px 10px}
button.b{cursor:pointer;font-weight:600}button.p{background:var(--ac);color:#fff;border-color:var(--ac)}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));background:var(--sf);border:1px solid var(--ln);border-radius:10px}
.kpi div{padding:14px 16px;border-right:1px solid var(--ln)}.kpi div:last-child{border:0}
.kpi small{color:var(--mut);display:block;font-size:12px}
.kpi b{font-size:24px;font-weight:800;display:block;line-height:1.2}
.d{font-size:12px;font-weight:600}.up{color:var(--up)}.dn{color:var(--dn)}.na{color:var(--mut)}
.box{background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:12px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.tabs button{border:0;background:none;color:var(--mut);font:inherit;font-weight:600;padding:4px 10px;border-radius:6px;cursor:pointer}
.tabs button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.sc{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:560px;font-size:14px}
th,td{padding:8px 10px;text-align:right;border-bottom:1px solid var(--ln);white-space:nowrap}
th:first-child,td:first-child,td.l,th.l{text-align:left}th{color:var(--mut);font-weight:600;font-size:12px}
tr.sel td{background:color-mix(in srgb,var(--ac) 10%,transparent);font-weight:600}
.ins{margin:0 0 10px;padding-left:18px}.ins li{margin:3px 0}
#rep{width:100%;min-height:200px;line-height:1.7;resize:vertical}
details{margin-top:28px}summary{cursor:pointer;font-weight:800}
.note{color:var(--mut);font-size:12px;margin:6px 0}
.add input{flex:1 1 220px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px}
.chip{display:inline-flex;border:1px solid var(--ln);border-radius:999px;background:var(--sf);overflow:hidden}
.chip.on{border-color:var(--ac)}
.chip button{border:0;background:none;color:var(--ink);font:inherit;cursor:pointer;padding:7px 12px}
.chip .cn{font-weight:600}
.chip.on .cn{background:var(--ac);color:var(--bg)}
.chip .cx{color:var(--mut);border-left:1px solid var(--ln);padding:7px 11px}
.chip .cx.ask{color:var(--dn);font-weight:700}
.fld{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px;margin-bottom:8px}
.fld label{font-size:12px;color:var(--mut);display:block}
.fld input{width:100%}
.leg{font-size:12px;color:var(--mut);margin:4px 0 8px}
button.sm{padding:3px 9px;font-size:12px;cursor:pointer;font-weight:600}
#pv{width:100%;max-height:420px;background:#000;border-radius:8px;margin-top:8px}
.dot{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:middle}
</style></head>
<body><main>
<h1>치지직 스트리머 리포트</h1>
<p class="sub" id="src"></p>

<div class="chips" id="chips" aria-label="스트리머 선택"></div>
<div class="bar add">
 <input id="url" placeholder="치지직 채널 링크 (chzzk.naver.com/채널ID)" aria-label="채널 링크">
 <input id="nm" placeholder="스트리머 이름" aria-label="스트리머 이름" style="flex:0 1 150px">
 <button class="b p" id="addc">추가</button>
</div>
<p class="note" id="amsg"></p>

<div class="bar"><span id="link" class="note"></span></div>
<div class="bar">
 <div class="seg" role="group" aria-label="기간 단위"><button id="mDay" aria-pressed="true">일간</button><button id="mWeek" aria-pressed="false">주간</button></div>
 <select id="per" aria-label="기간"></select>
</div>

<div class="kpi" id="kpi"></div>

<h2>추이</h2>
<div class="box"><div class="tabs" id="tabs"></div><div id="chart"></div></div>

<h2>기간별 데이터</h2>
<div class="box sc"><table id="tbl"></table></div>

<h2>카테고리 전환 구간</h2>
<p class="note">선택한 기간의 방송을 카테고리가 바뀐 지점마다 나눈 기록입니다.</p>
<div class="box sc"><table id="seg"></table></div>

<h2>카테고리별 분석</h2>
<div class="box">
 <ul class="ins" id="ins"></ul>
 <div class="sc"><table id="cat"></table></div>
 <p class="note">전체 기간 기준이며, 카테고리 방송시간이 3시간 미만이면 표본이 적어 참고용입니다(※). 시간당 수치는 방송시간이 달라도 비교할 수 있게 맞춘 값입니다.</p>
</div>

<h2>스트리머에게 보낼 리포트</h2>
<div class="box">
 <textarea id="rep" aria-label="리포트 문구"></textarea>
 <div class="bar" style="margin:8px 0 0"><button class="b p" id="copy">리포트 복사</button><span class="note" id="cmsg"></span></div>
</div>

</main>
<script>
const $=s=>document.querySelector(s),N=v=>Math.round(v).toLocaleString('ko-KR'),DOW=['일','월','화','수','목','금','토'];
const pad=n=>String(n).padStart(2,'0'),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const dt=s=>new Date(s+'T00:00:00');
const addD=(s,n)=>{const d=dt(s);d.setDate(d.getDate()+n);return fmt(d)};
const wk=s=>{const d=dt(s);d.setDate(d.getDate()-(d.getDay()+6)%7);return fmt(d)};
const md=s=>+s.slice(5,7)+'/'+ +s.slice(8);
const S=(a,k)=>a.reduce((x,r)=>x+r[k],0);
const METRICS=[['peak','최고 시청자','명'],['avg','평균 시청자','명'],['chat','채팅수','건'],['cheese','치즈 수익','원'],['hours','방송시간','시간']];
let D={channels:[],rows:[]},st={mode:'day',per:null,m:'peak',ch:null};
try{const s=JSON.parse(localStorage.getItem('cz2')||'null');if(s&&Array.isArray(s.channels))D=s}catch(e){}
const save=()=>{try{localStorage.setItem('cz2',JSON.stringify(D))}catch(e){}};

function rng(s){return()=>(s=(s*1664525+1013904223)%4294967296)/4294967296}
const SC={id:'sample',name:'샘플 스트리머'};
const SR=(()=>{const C=[['저스트 채팅',100,60],['노래',150,14],['리그 오브 레전드',110,22],['마인크래프트',85,30]],out=[],end=new Date(2026,10,5);
 for(let i=55;i>=0;i--){const d=new Date(end);d.setDate(end.getDate()-i);const r=rng(i*31+7);if(r()<.2)continue;
  const a=Math.floor(r()*4),b=(a+1+Math.floor(r()*3))%4,two=r()<.6;
  (two?[a,b]:[a]).forEach(k=>{const[c,base,cf]=C[k],h=+(1+r()*2.5).toFixed(1),avg=Math.round(base*(.8+r()*.5));
   out.push({ch:'sample',date:fmt(d),cat:c,peak:Math.round(avg*(1.4+r()*.6)),avg,chat:Math.round(h*cf*avg/10*(.8+r()*.4)),cheese:Math.round(avg*h*(3+r()*5))*100,hours:h})})}
 return out})();

function parse(t,ch){return t.split(/\r?\n/).map(l=>(l.includes('\t')?l.split('\t').map(x=>x.replace(/,/g,'')):l.split(',')).map(x=>x.trim()))
 .filter(c=>/^\d{4}-\d{2}-\d{2}$/.test(c[0])&&c[1]).map(c=>({ch,date:c[0],cat:c[1],peak:+c[2]||0,avg:+c[3]||0,chat:+c[4]||0,cheese:+c[5]||0,hours:+c[6]||0}))}
function agg(a){if(!a.length)return null;const h=S(a,'hours');
 return{peak:Math.max(...a.map(r=>r.peak)),avg:h>0?a.reduce((x,r)=>x+r.avg*r.hours,0)/h:S(a,'avg')/a.length,chat:S(a,'chat'),cheese:S(a,'cheese'),hours:h,days:new Set(a.map(r=>r.date)).size}}
const keyOf=r=>st.mode==='day'?r.date:wk(r.date);
function lab(k){return st.mode==='day'?md(k)+'('+DOW[dt(k).getDay()]+')':md(k)+'~'+md(addD(k,6))}
const pct=(c,p)=>p?(c-p)/p*100:null;
function delta(c,p){const v=pct(c,p);if(v==null)return['<span class="d na">비교 데이터 없음</span>','비교 데이터 없음'];const s=(v>=0?'+':'')+v.toFixed(0)+'%';
 return['<span class="d '+(v>=0?'up':'dn')+'">'+(v>=0?'▲ ':'▼ ')+Math.abs(v).toFixed(0)+'% '+(st.mode==='day'?'전일':'전주')+'</span>',s]}
const sg=v=>v==null?'-':'<span class="'+(v>=0?'up':'dn')+'">'+(v>=0?'+':'')+v.toFixed(0)+'%</span>';
const byCat=a=>{const m=new Map();a.forEach(r=>(m.get(r.cat)||m.set(r.cat,[]).get(r.cat)).push(r));return[...m].map(([c,x])=>({c,n:x.length,...agg(x)}))};

function render(){
 const real=D.channels.length>0,chs=real?D.channels:[SC],all=real?D.rows:SR;
 if(!chs.some(c=>c.id===st.ch))st.ch=chs[0].id;
 const ch=chs.find(c=>c.id===st.ch);
 $('#chips').innerHTML=chs.map(c=>{const on=c.id===st.ch,ask=real&&st.ask===c.id;return `<span class="chip${on?' on':''}"><button class="cn" data-id="${c.id}" aria-pressed="${on}">${esc(c.name)}</button>${real?`<button class="cx${ask?' ask':''}" data-del="${c.id}" aria-label="${esc(c.name)} 삭제">${ask?'삭제할까요?':'×'}</button>`:''}</span>`}).join('');
 $('#chips').querySelectorAll('.cn').forEach(b=>b.onclick=()=>{st.ch=b.dataset.id;st.per=null;st.ask=null;st.v=null;st.vf=null;st.vAsk=false;render()});
 $('#chips').querySelectorAll('.cx').forEach(b=>b.onclick=()=>{const id=b.dataset.del;if(st.ask!==id){st.ask=id;render();return}delCh(id)});
 $('#link').innerHTML=real?`<a href="https://chzzk.naver.com/${ch.id}" target="_blank" rel="noopener">치지직 채널 열기</a>`:'';
 $('#src').textContent=real?ch.name+' 채널입니다. 이 페이지는 방송 데이터를 수집하지 못해서, 링크를 추가해도 숫자는 채워지지 않아요.':'샘플 데이터입니다. 이 페이지는 방송 데이터를 수집하지 못해서, 링크를 추가해도 실제 숫자는 나오지 않아요.';
 const cr=all.filter(r=>r.ch===ch.id),g=new Map();
 cr.forEach(r=>{const k=keyOf(r);(g.get(k)||g.set(k,[]).get(k)).push(r)});
 const keys=[...g.keys()].sort();
 if(!keys.length){['#chart','#tbl','#seg','#cat','#ins','#rep'].forEach(s=>{$(s).innerHTML='';if(s==='#rep')$(s).value=''});$('#per').innerHTML='';
  $('#kpi').innerHTML='<div style="grid-column:1/-1">이 페이지는 치지직에 접속할 수 없어 추적을 시작하지 못해요. 링크를 넣는 순간부터 자동으로 추적하려면 별도 수집 프로그램이 켜져 있어야 해요.</div>';return}
 if(!keys.includes(st.per))st.per=keys[keys.length-1];
 $('#per').innerHTML=[...keys].reverse().map(k=>`<option value="${k}">${lab(k)}</option>`).join('');$('#per').value=st.per;
 const i=keys.indexOf(st.per),cur=agg(g.get(st.per)),prev=i>0?agg(g.get(keys[i-1])):null;
 $('#kpi').innerHTML=METRICS.map(([k,l,u])=>`<div><small>${l}</small><b>${k==='hours'?cur[k].toFixed(1):N(cur[k])}<span class="note"> ${u}</span></b>${k==='hours'?'':delta(cur[k],prev&&prev[k])[0]}</div>`).join('');
 const win=keys.slice(Math.max(0,i-(st.mode==='day'?14:8)+1),i+1);
 $('#tabs').innerHTML=METRICS.slice(0,4).map(([k,l])=>`<button aria-pressed="${st.m===k}" data-m="${k}">${l}</button>`).join('');
 $('#tabs').querySelectorAll('button').forEach(b=>b.onclick=()=>{st.m=b.dataset.m;render()});
 const vals=win.map(k=>agg(g.get(k))[st.m]),W=640,H=200,p=6,bw=(W-p*2)/win.length,mx=Math.max(...vals,1);let svg='';
 vals.forEach((v,j)=>{const h=(H-50)*v/mx,x=p+j*bw+bw*.15,y=H-24-h,on=win[j]===st.per;
  svg+=`<rect x="${x}" y="${y}" width="${bw*.7}" height="${h}" rx="3" fill="var(--ac)" opacity="${on?1:.3}"/>`;
  if(on||win.length<=8)svg+=`<text x="${x+bw*.35}" y="${y-4}" text-anchor="middle" font-size="11" font-weight="700" fill="var(--ink)">${N(v)}</text>`;
  if(win.length<=10||j%2===0)svg+=`<text x="${x+bw*.35}" y="${H-7}" text-anchor="middle" font-size="10" fill="var(--mut)">${md(win[j])}</text>`});
 $('#chart').innerHTML=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${METRICS.find(m=>m[0]===st.m)[1]} 추이">${svg}</svg>`;
 const line=(l,a,c)=>`<tr${c?' class="sel"':''}><td>${l}</td><td>${N(a.peak)}</td><td>${N(a.avg)}</td><td>${N(a.chat)}</td><td>${N(a.cheese)}</td><td>${a.hours.toFixed(1)}h</td></tr>`;
 $('#tbl').innerHTML='<tr><th>기간</th><th>최고</th><th>평균</th><th>채팅수</th><th>치즈(원)</th><th>방송시간</th></tr>'+[...win].reverse().map(k=>line(lab(k),agg(g.get(k)),k===st.per)).join('');
 const sr=g.get(st.per);
 $('#seg').innerHTML='<tr><th>날짜</th><th class="l">카테고리</th><th>평균</th><th>최고</th><th>채팅수</th><th>치즈(원)</th><th>시간</th><th>직전 구간 대비 평균</th></tr>'+sr.map((r,j)=>{const q=sr[j-1],ch2=q&&q.date===r.date;
  return `<tr><td>${md(r.date)}</td><td class="l">${esc(r.cat)}</td><td>${N(r.avg)}</td><td>${N(r.peak)}</td><td>${N(r.chat)}</td><td>${N(r.cheese)}</td><td>${r.hours}h</td><td>${ch2?esc(q.cat)+' → '+sg(pct(r.avg,q.avg)):'-'}</td></tr>`}).join('');
 const cs=byCat(cr).sort((a,b)=>b.avg-a.avg),tot=agg(cr),ok=cs.filter(c=>c.hours>=3),pool=ok.length?ok:cs;
 const top=f=>pool.reduce((a,b)=>f(b)>f(a)?b:a),hc=c=>c.chat/(c.hours||1),hz=c=>c.cheese/(c.hours||1);
 const b1=top(c=>c.avg),b2=top(hc),b3=top(hz);
 $('#ins').innerHTML=cs.length<2?'<li>카테고리가 2개 이상 쌓이면 비교 결과가 나와요.</li>':
  `<li>평균 시청자가 가장 높은 카테고리: <b>${esc(b1.c)}</b> (${N(b1.avg)}명, 전체 평균 대비 ${sg(pct(b1.avg,tot.avg))})</li>`+
  `<li>시간당 채팅이 가장 많은 카테고리: <b>${esc(b2.c)}</b> (${N(hc(b2))}건/시간)</li>`+
  `<li>시간당 치즈 수익이 가장 높은 카테고리: <b>${esc(b3.c)}</b> (${N(hz(b3))}원/시간)</li>`;
 $('#cat').innerHTML='<tr><th class="l">카테고리</th><th>구간 수</th><th>방송시간</th><th>평균 시청자</th><th>전체 평균 대비</th><th>최고</th><th>채팅/시간</th><th>치즈/시간</th></tr>'+cs.map(c=>
  `<tr><td class="l">${esc(c.c)}${c.hours<3?' ※':''}</td><td>${c.n}</td><td>${c.hours.toFixed(1)}h</td><td>${N(c.avg)}</td><td>${sg(pct(c.avg,tot.avg))}</td><td>${N(c.peak)}</td><td>${N(hc(c))}</td><td>${N(hz(c))}</td></tr>`).join('');
 $('#rep').value=report(ch,sr,g,cur,prev);
}
function report(ch,sr,g,cur,prev){
 const u=st.mode==='day'?'일간':'주간',pv=st.mode==='day'?'전일':'전주',d=k=>delta(cur[k],prev&&prev[k])[1];
 const L=[`[아르포나] ${ch.name} 님 ${u} 리포트 (${lab(st.per)})`,
 `▪ 최고 시청자: ${N(cur.peak)}명 (${pv} 대비 ${d('peak')})`,`▪ 평균 시청자: ${N(cur.avg)}명 (${pv} 대비 ${d('avg')})`,
 `▪ 채팅수: ${N(cur.chat)}건 (${pv} 대비 ${d('chat')})`,`▪ 치즈 수익: ${N(cur.cheese)}원 (${pv} 대비 ${d('cheese')})`,
 st.mode==='week'?`▪ 방송: ${cur.days}일 / 총 ${cur.hours.toFixed(1)}시간`:`▪ 방송시간: ${cur.hours.toFixed(1)}시간`];
 const cs=byCat(sr).sort((a,b)=>b.avg-a.avg);
 if(cs.length)L.push('▪ 카테고리별 평균 시청자: '+cs.map(c=>`${c.c} ${N(c.avg)}명(${c.hours.toFixed(1)}h)`).join(' / '));
 if(st.mode==='week'){const b=sr.reduce((x,r)=>r.peak>x.peak?r:x);L.push(`▪ 최고 기록: ${md(b.date)}(${DOW[dt(b.date).getDay()]}) ${b.cat} 방송, 최고 시청자 ${N(b.peak)}명`)}
 return L.join('\n')}

$('#mDay').onclick=()=>setMode('day');$('#mWeek').onclick=()=>setMode('week');
function setMode(m){st.mode=m;st.per=null;$('#mDay').setAttribute('aria-pressed',m==='day');$('#mWeek').setAttribute('aria-pressed',m==='week');render()}
function delCh(id){const i=D.channels.findIndex(c=>c.id===id);if(i<0)return;D.channels.splice(i,1);D.rows=D.rows.filter(r=>r.ch!==id);D.vods=(D.vods||[]).filter(v=>v.ch!==id);save();st.ask=null;if(st.ch===id){const n=D.channels[Math.min(i,D.channels.length-1)];st.ch=n?n.id:null}st.per=null;st.v=null;st.vf=null;render()}
$('#per').onchange=e=>{st.per=e.target.value;render()};
$('#addc').onclick=()=>{const m=$('#url').value.match(/[0-9a-f]{32}/i),n=$('#nm').value.trim();
 if(!m){$('#amsg').textContent='채널 링크에서 채널 ID를 찾지 못했어요. chzzk.naver.com/ 뒤에 32자리 ID가 붙은 채널 주소를 넣어 주세요.';return}
 if(!n){$('#amsg').textContent='스트리머 이름을 입력해 주세요.';return}
 const id=m[0].toLowerCase();if(D.channels.some(c=>c.id===id)){st.ch=id;$('#amsg').textContent='이미 추가된 스트리머예요.';render();return}
 D.channels.push({id,name:n});save();st.ch=id;st.per=null;$('#url').value=$('#nm').value='';
 $('#amsg').textContent=n+' 님을 목록에 추가했어요. 이 페이지에서는 추적이 시작되지 않아요.';render()};
$('#copy').onclick=async()=>{const t=$('#rep');let ok=false;try{await navigator.clipboard.writeText(t.value);ok=true}catch(e){t.select();try{ok=document.execCommand('copy')}catch(e2){}}
 $('#cmsg').textContent=ok?'복사했어요.':'복사하지 못했어요. 문구를 직접 선택해 복사해 주세요.'};
render();
</script></body></html>
